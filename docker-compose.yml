services:
  ionsync:
    image: ionsync:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # ed25519 private key that signs the plugin auto-update bundle.
        # Set as a build-time secret on the Dockhand stack (never committed).
        # Empty when unset -> unsigned build (signed clients refuse to update).
        IONSYNC_SIGN_KEY: ${IONSYNC_SIGN_KEY:-}
    ports:
      - "${IONSYNC_PORT:-3000}:3000"
      - "${IONSYNC_DASH:-3001}:3001"
    volumes:
      - ${IONSYNC_DATA:-ionsync_data}:/data
      # Mount a hand-written config instead of env vars:
      # - ./config.js:/app/config.js:ro
      # TLS certificates (also set tls: {} in config.js):
      # - ./certs:/certs:ro
    environment:
      IONSYNC_PASSWORD: ${IONSYNC_PASSWORD:?Create a .env file and set IONSYNC_PASSWORD}
      # Raise the V8 old-generation heap limit.  Default auto-detection on Alpine
      # is ~2 GB which is too low when syncing vaults with files in the 100s of MB.
      NODE_OPTIONS: "--max-old-space-size=4096"
      # IONSYNC_PORT: 3000
      # IONSYNC_HOST: 0.0.0.0
      # IONSYNC_LOG_LEVEL: 3          # 0=silent 1=error 2=warn 3=info
      # IONSYNC_VERSIONS_PER_FILE: 5
      # IONSYNC_CLEANUP_INTERVAL: 3600
      # IONSYNC_KEEP_DELETED_SECS: 604800
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/dashboard', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── LLM API (optional) ────────────────────────────────────────────────────
  # Token-authenticated REST API that lets an LLM search, read, write and edit
  # notes. It connects to the server above as an ordinary sync device, so the
  # server itself never sees plaintext when the vault is end-to-end encrypted.
  # Stays idle (no port opened) until IONSYNC_API_TOKEN is set.
  # See packages/api/README.md.
  ionsync-api:
    image: ionsync:latest
    entrypoint: ["node", "--enable-source-maps", "api/dist/index.js"]
    depends_on:
      - ionsync
    ports:
      - "${IONSYNC_API_PORT:-3002}:3002"
    environment:
      IONSYNC_API_SERVER_URL: ws://ionsync:3000
      IONSYNC_PASSWORD: ${IONSYNC_PASSWORD:?Create a .env file and set IONSYNC_PASSWORD}
      # Long random secret (24+ chars), e.g. `openssl rand -hex 32`.
      IONSYNC_API_TOKEN: ${IONSYNC_API_TOKEN:-}
      # Optional second token that can only read and search.
      IONSYNC_API_READ_TOKEN: ${IONSYNC_API_READ_TOKEN:-}
      # The vault's encryption password, if E2EE is on in the plugin.
      IONSYNC_E2EE_PASSWORD: ${IONSYNC_E2EE_PASSWORD:-}
      # Set to 1 when the API sits behind a reverse proxy / Cloudflare tunnel.
      IONSYNC_API_TRUST_PROXY: ${IONSYNC_API_TRUST_PROXY:-0}
      # Optional: base URL advertised in /v1/openapi.json (default: from the request).
      IONSYNC_API_PUBLIC_URL: ${IONSYNC_API_PUBLIC_URL:-}
    restart: unless-stopped
