name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20" # matches production (node:20-alpine)
          cache: npm

      - name: Install dependencies
        run: npm ci

      # protocol emits dist/, which server + plugin typecheck and the server
      # test suite resolve @ionsync/protocol against — build it first.
      - name: Build protocol
        run: npm run build --workspace=packages/protocol

      - name: Typecheck (protocol + server)
        run: npm run typecheck

      - name: Typecheck (plugin)
        run: npm run typecheck --workspace=packages/plugin

      - name: Server test suite
        run: npm test --workspace=packages/server
