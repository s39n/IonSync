name: Docker image

# Builds the server image and publishes it to GitHub Container Registry so a
# new user can `docker compose up` without cloning or compiling anything:
#
#     ghcr.io/s39n/ionsync:latest      newest main
#     ghcr.io/s39n/ionsync:<version>   newest build of that plugin version
#     ghcr.io/s39n/ionsync:sha-<sha>   one exact commit (for pinning / rollback)
#
# Each architecture is built on a NATIVE runner (no QEMU) and the two images
# are then joined into one multi-arch tag. The emulated arm64 build took 20-25
# minutes and once hung until GitHub's 6-hour limit; native builds take a few
# minutes, and every job has a timeout.
#
# Pull requests only BUILD (both architectures, nothing pushed, no secrets) so a
# broken Dockerfile is caught before it reaches main.
#
# This is additive: a build-from-git deployment (Dockhand) is unaffected.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - "docker-compose*.yml"
      - package.json
      - package-lock.json
      - "packages/**"
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/s39n/ionsync
  # The signing key travels as a build argument. Keep it out of everything the
  # action would otherwise publish about the build (job summary and the
  # downloadable build record both list build arguments).
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Catches compose mistakes (bad interpolation, undefined volumes) for the
      # default named volume and for a host-path data directory.
      - name: Validate compose files
        env:
          IONSYNC_PASSWORD: ci-check
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.image.yml config -q
          IONSYNC_DATA=/srv/ionsync docker compose -f docker-compose.yml config -q
          IONSYNC_DATA=/srv/ionsync docker compose -f docker-compose.image.yml config -q
          IONSYNC_DATA=/srv/ionsync IONSYNC_IMAGE=ionsync-staging:latest docker compose -p ionsync-staging -f docker-compose.staging.yml config -q

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./packages/plugin/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=IonSync
            org.opencontainers.image.description=Self-hosted vault sync server for Obsidian
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # IONSYNC_SIGN_KEY (optional repo secret) signs the plugin auto-update
      # bundle inside the image. It is only an ARG of the discarded builder
      # stage, so it is not in the published image or its history. Without the
      # secret the image still works; it just ships an unsigned bundle.
      #
      # provenance/sbom are off and no build cache is exported on purpose:
      # provenance attestations record build arguments, which would publish the
      # key. Do not turn them on while the key is passed as a build argument.
      #
      # On main the image is pushed by digest only (no tag yet); the merge job
      # below joins both architectures under the real tags.
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          build-args: |
            IONSYNC_SIGN_KEY=${{ github.event_name != 'pull_request' && secrets.IONSYNC_SIGN_KEY || '' }}
          provenance: false
          sbom: false

      # Hand the digest to the merge job as an empty file named after it.
      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch tags
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./packages/plugin/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha

      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          count=$(ls | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 architecture digests, found $count"; exit 1
          fi
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
