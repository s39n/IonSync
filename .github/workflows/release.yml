name: Release plugin

# Builds the Obsidian plugin from source in CI and publishes the release assets
# with GitHub artifact attestations (build provenance). Triggered by pushing a
# version tag, e.g.:
#
#     git tag 2.0.5
#     git push origin 2.0.5
#
# The tag must match packages/plugin/manifest.json's version (checked below).
# Only main.js, manifest.json and styles.css are attached — versions.json and
# other files are intentionally excluded (Obsidian ignores them, and the
# community reviewer flags extras).

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC token used to sign the attestation
  attestations: write # record the build-provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish attested release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20" # matches production (node:20-alpine)
          cache: npm

      # Reproducible install straight from the committed lockfile.
      - name: Install dependencies
        run: npm ci

      # protocol emits dist/, which the plugin's typecheck resolves
      # @ionsync/protocol against — build it before the plugin.
      - name: Build protocol
        run: npm run build --workspace=packages/protocol

      - name: Build plugin
        run: npm run build --workspace=packages/plugin

      # Guard against a tag/manifest mismatch producing a mislabelled release.
      - name: Verify manifest version matches tag
        run: |
          manifest_version="$(node -p "require('./packages/plugin/manifest.json').version")"
          if [ "$manifest_version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::manifest.json version ($manifest_version) does not match tag (${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "manifest.json version matches tag: $manifest_version"

      # Cryptographically attest that these assets were built from this repo in
      # this workflow run (Sigstore-backed build provenance).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/plugin/main.js
            packages/plugin/manifest.json
            packages/plugin/styles.css

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            packages/plugin/main.js \
            packages/plugin/manifest.json \
            packages/plugin/styles.css \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
